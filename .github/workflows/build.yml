name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: feiyi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/feiyi

  # Unit tests: pure logic inside the daemon (config merge, cleanup guards,
  # push payloads, snapshot cleaning, retry classification, ...).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --bins

  # Integration tests: start the real binary and drive it over HTTP and
  # WebSocket like the app does (tests/e2e.rs, with a fake `claude` CLI).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests
        run: cargo test --test e2e -- --test-threads=4

  # Static musl binaries for the Docker image (Alpine), one per architecture,
  # built natively on matching runners (no cross toolchain or QEMU).
  musl:
    needs: [build, unit, integration]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: feiyi-x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: feiyi-aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/feiyi "${{ matrix.name }}"
          sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*

  # The web app for the macOS binary, served at /.
  web:
    uses: ./.github/workflows/web-app.yml

  # One portable Apple Silicon binary with the web app embedded. Unsigned: the
  # README tells users to clear the quarantine flag.
  mac:
    needs: [web]
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      NAME: feiyi-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app-dist
      # The app adds the daemon it is served from as a host when this global is set
      # (readInitialDaemonConnectionHint in web/app); the CSP allows 'self' scripts.
      - name: Point the app at its own daemon
        working-directory: app-dist
        run: |
          set -euo pipefail
          echo 'globalThis.__PASEO_INITIAL_DAEMON_CONNECTION__={listen:location.host,useTls:location.protocol==="https:"};' > feiyi-init.js
          grep -q '^    <meta charset="utf-8" />$' index.html
          sed -i '' 's|^    <meta charset="utf-8" />$|&\
              <script src="/feiyi-init.js"></script>|' index.html
          grep -q feiyi-init.js index.html
      - name: Unit tests
        run: cargo test --bins
      - name: Build
        env:
          FEIYI_APP_DIST: ${{ github.workspace }}/app-dist
        run: |
          touch src/app.rs
          cargo build --release --target "$TARGET" --features app
      - name: Smoke test
        env:
          PASEO_LITE_HOME: ${{ runner.temp }}/feiyi-home
          PASEO_LISTEN: 127.0.0.1:6799
          PASEO_RELAY_ENABLED: "false"
        run: |
          set -euo pipefail
          target/$TARGET/release/feiyi > "$RUNNER_TEMP/feiyi.log" 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 3
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:6799$1"; }
          fail() { echo "::error::$1"; cat "$RUNNER_TEMP/feiyi.log"; exit 1; }
          [ "$(code /)" = 200 ] || fail "/ is not the app"
          [ "$(code /pair)" = 200 ] || fail "/pair is not the pairing page"
          [ "$(code /some/app/route)" = 200 ] || fail "SPA fallback is missing"
          [ "$(code /missing.js)" = 404 ] || fail "a missing file is not 404"
          curl -s http://127.0.0.1:6799/ | grep -q 'id="root"' || fail "index.html is not the app"
          curl -s http://127.0.0.1:6799/pair | grep -qi 'feiyi' || fail "/pair content"
          curl -sI http://127.0.0.1:6799/ | grep -qi 'cache-control: no-cache' || fail "index.html cache header"
      - name: Stage tarball
        run: |
          set -euo pipefail
          mkdir stage
          cp "target/$TARGET/release/feiyi" stage/feiyi
          cp docs/README-mac.md stage/README-mac.md
          tar czf "$NAME.tar.gz" -C stage feiyi README-mac.md
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          ls -l "$NAME.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz*

  # Published as a rolling "latest" release so the image build downloads the
  # binaries instead of compiling.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [musl, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: feiyi-*-linux-musl
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: feiyi-aarch64-apple-darwin
          path: dist
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest
          git push -f origin latest
          files=(dist/*)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${files[@]}" --clobber
            gh release edit latest --target "$GITHUB_SHA" --latest=false
          else
            gh release create latest "${files[@]}" --title "latest" --notes "Rolling build of main for the Docker image" --target "$GITHUB_SHA" --latest=false
          fi
