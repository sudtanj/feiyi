name: pages

# Builds the feiyi web app (web/app, a fork of getpaseo/paseo packages/app) on GitHub Pages,
# so a browser can pair with feiyi through the relay without depending on app.paseo.sh.
# The other workspace packages and the lockfile come from upstream at a pinned release.
# Point the daemon's pairing link at it with
# PASEO_APP_BASE_URL=https://<user>.github.io/<repo> (or your custom domain).
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
#
# Only official actions, no Jekyll, no extra build tools: upstream's own `expo export` does
# the build, then a few shell/node lines adapt the output to the Pages subpath.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "getpaseo/paseo tag or commit to build"
        required: true
        default: "v0.12.0"
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml, "web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'v0.12.0' }}
  # Skip the large binaries other upstream workspaces download on install; the web export
  # needs none of them.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/checkout@v4
        with:
          repository: getpaseo/paseo
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          sparse-checkout: web
          sparse-checkout-cone-mode: true
          path: self
          persist-credentials: false

      # npm ci uses upstream's lockfile, so the fork must keep the same dependencies. Bumping
      # them means vendoring a newer tag (web/app/UPSTREAM.md) and pinning UPSTREAM_REF to it.
      - name: Swap in web/app
        run: |
          cmp upstream/packages/app/package.json self/web/app/package.json \
            || { echo "::error::web/app/package.json differs from upstream $UPSTREAM_REF; the lockfile would not match"; exit 1; }
          rm -rf upstream/packages/app
          cp -a self/web/app upstream/packages/app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install
        working-directory: upstream
        run: node scripts/npm-retry.mjs ci --no-audit --no-fund

      # Not committed: the Mermaid runtime is a 3.6 MB JSON string in html.gen.ts, served as a
      # static file so it stays out of the main bundle, and the PNG icons are redrawn from the
      # feiyi mark. Neither can be generated without node/rsvg on a dev machine.
      - name: Generate Mermaid runtime and icons
        working-directory: upstream/packages/app
        run: |
          node -e '
            const fs = require("fs");
            const m = fs.readFileSync(process.argv[1], "utf8").match(/export const mermaidRuntimeHtml = (".*");/s);
            if (!m) { console.error("::error::html.gen.ts format changed"); process.exit(1); }
            fs.writeFileSync(process.argv[2], JSON.parse(m[1]));
          ' src/components/markdown/fence/mermaid/runtime/html.gen.ts public/mermaid-runtime.html
          # Image assets: the tab icon the app swaps by agent state (plain, running = blue dot,
          # needs attention = green dot), the notification icon and the app icon. Each is redrawn at
          # its upstream size, so layouts do not shift.
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          cd assets/images
          mark='<path fill="#E5553B" d="M144 176H192V344L144 392Z M144 176H328L368 128L344 224H144Z M192 272H280L312 240L296 312H192Z"/>'
          draw() { # file, svg body: render at the PNG's current width
            w=$(od -An -tu1 -j16 -N4 "$1" | awk '{print $1*16777216+$2*65536+$3*256+$4}')
            printf '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">%s</svg>' "$2" > /tmp/icon.svg
            rsvg-convert -w "$w" -h "$w" /tmp/icon.svg -o "$1"
          }
          tile='<rect width="512" height="512" rx="114" fill="#181B1A"/>'
          for t in dark light; do
            draw favicon-$t.png "$tile$mark"
            draw favicon-$t-running.png "$tile$mark<circle cx=\"417\" cy=\"417\" r=\"95\" fill=\"#3b82f6\"/>"
            draw favicon-$t-attention.png "$tile$mark<circle cx=\"417\" cy=\"417\" r=\"95\" fill=\"#22c55e\"/>"
          done
          draw notification-icon.png "${mark/\#E5553B/#FFFFFF}"
          draw favicon.png "$tile$mark"
          draw icon.png "$tile$mark"


      - name: Build
        working-directory: upstream
        env:
          EXPO_PUBLIC_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build:web --workspace=@getpaseo/app

      # Upstream's own unit project; the browser and e2e projects need Playwright browsers.
      # Runs after Build because both need the workspace packages that build:app-deps emits.
      - name: Typecheck and unit tests
        working-directory: upstream/packages/app
        run: |
          npm run typecheck
          npx vitest run --project unit

      - name: Brand as feiyi
        working-directory: upstream/packages/app/dist
        run: |
          logo="$GITHUB_WORKSPACE/self/web/logo.svg"
          cp "$logo" logo.svg
          for s in 192 512; do rsvg-convert -w $s -h $s "$logo" -o pwa-icon-$s.png; done
          rsvg-convert -w 180 -h 180 "$logo" -o apple-touch-icon.png
          grep -q 'rel="icon" href="[^"]*favicon.ico"' index.html || { echo "::error::favicon link changed upstream"; exit 1; }
          sed -i 's|<link rel="icon" href="[^"]*favicon.ico" />|<link rel="icon" type="image/svg+xml" href="/logo.svg" />|' index.html
          sed -i 's/Paseo/feiyi/g' index.html
          sed -i -E 's/"(name|short_name)": "Paseo"/"\1": "feiyi"/' manifest.json
          # The app's own copy (titles, welcome, notifications). Only the word on its own, so
          # identifiers like PaseoClient stay; a leading / keeps the desktop download URLs.
          find _expo/static/js -name '*.js' -exec sed -i -E 's#(^|[^A-Za-z0-9_$/])Paseo([^A-Za-z0-9_$]|$)#\1feiyi\2#g' {} +
          echo "[*] Paseo left in the app: $(cat _expo/static/js/web/*.js | grep -oE '(^|[^A-Za-z0-9_$/])Paseo([^A-Za-z0-9_$]|$)' | wc -l) standalone"

      - name: Adapt the output for Pages
        working-directory: upstream/packages/app/dist
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          EXTRA_CONNECT_SRC: ${{ vars.PAGES_EXTRA_CONNECT_SRC }}
        run: |
          # Source maps are only for debugging; they would double the download size.
          find . -name '*.map' -delete
          if [ -n "$BASE" ]; then
            # Root-absolute links in the hand-written HTML shell (manifest, icons), and the
            # PWA manifest's scope and icons. The second expression undoes a double prefix on
            # paths Expo already wrote under the base path.
            sed -i -E -e 's#(href|src)="/([^/"])#\1="'"$BASE"'/\2#g' -e 's#url\(/fonts/#url('"$BASE"'/fonts/#g' -e 's#"'"$BASE$BASE"'/#"'"$BASE"'/#g' index.html
            sed -i -E -e 's#"(id|start_url|scope|src)": "/#"\1": "'"$BASE"'/#' -e 's#"'"$BASE$BASE"'/#"'"$BASE"'/#g' manifest.json
          fi
          # Keep what you paste (pairing links) and what the app stores in this browser: a
          # Content Security Policy lets the page talk only to the Paseo relay, a daemon on this
          # machine, and the sources in the PAGES_EXTRA_CONNECT_SRC repository variable (e.g. a
          # self-hosted relay or an HTTPS daemon: "wss://relay.example.com wss://paseo.example.com").
          # No third-party scripts, no other hosts for fetch/WebSocket/beacons, no referrer.
          # 'wasm-unsafe-eval' only lets bundled WebAssembly compile; it opens no network path.
          case "$EXTRA_CONNECT_SRC" in *[!A-Za-z0-9:/.*\ \[\]-]*)
            echo "::error::PAGES_EXTRA_CONNECT_SRC may only hold space-separated sources like wss://host:port"; exit 1;; esac
          csp="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'"
          csp="$csp; connect-src 'self' data: blob: wss://relay.paseo.sh ws://localhost:* ws://127.0.0.1:* ${EXTRA_CONNECT_SRC}"
          csp="$csp; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' data:"
          csp="$csp; media-src 'self' data: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:"
          csp="$csp; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
          csp=$(printf '%s' "$csp" | tr -s ' ')
          grep -q '^    <meta charset="utf-8" />$' index.html || { echo "::error::index.html head changed upstream"; exit 1; }
          sed -i "s|^    <meta charset=\"utf-8\" />\$|&\n    <meta http-equiv=\"Content-Security-Policy\" content=\"${csp}\" />\n    <meta name=\"referrer\" content=\"no-referrer\" />|" index.html
          echo "[*] CSP: $csp"
          # Installed app: rotate freely (tablets, landscape phones, desktop windows).
          sed -i '/^  "orientation": /d' manifest.json
          node -e 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8"))'
          # No offline cache: every launch loads the latest deploy. Browsers that installed the
          # old caching worker fetch this one on their next visit; it wipes the caches,
          # unregisters itself and reloads open tabs from the network.
          cat > sw.js <<'SW'
          self.addEventListener("install", () => self.skipWaiting());
          self.addEventListener("activate", (e) => e.waitUntil((async () => {
            for (const k of await caches.keys()) await caches.delete(k);
            await self.registration.unregister();
            for (const c of await self.clients.matchAll({ type: "window" })) c.navigate(c.url).catch(() => {});
          })()));
          SW
          # Pages has no SPA rewrites: unknown paths (deep links, reloads) get the app too.
          cp index.html 404.html
          touch .nojekyll
          {
            echo "### feiyi web app ${UPSTREAM_REF}"
            echo
            echo "| | size |"
            echo "|---|---|"
            echo "| site | $(du -sh . | cut -f1) |"
            echo "| JavaScript | $(find . -name '*.js' -print0 | du -ch --files0-from=- | tail -1 | cut -f1) |"
            echo "| JavaScript, gzipped (what a browser downloads) | $(find . -name '*.js' -exec cat {} + | gzip -9 | wc -c | numfmt --to=iec) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The patches above only change paths and loading, but a mistake would show up as a blank
      # page, not a build error. Serve the output under the same base path and check that the
      # app renders in the runner's preinstalled Chrome.
      - name: Smoke test (the app starts)
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          dist="$PWD/upstream/packages/app/dist"
          root="$RUNNER_TEMP/site"; mkdir -p "$root"
          if [ -n "$BASE" ]; then mkdir -p "$root$(dirname "$BASE")"; ln -s "$dist" "$root$BASE"; else root="$dist"; fi
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$root" >/dev/null 2>&1 &
          sleep 1
          paths="$BASE/ $BASE/sw.js $BASE/logo.svg $BASE/pwa-icon-512.png"; [ -f "$dist/mermaid-runtime.html" ] && paths="$paths $BASE/mermaid-runtime.html"
          for path in $paths; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            [ "$code" = 200 ] || { echo "::error::$path answered $code"; exit 1; }
          done
          timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1 \
            --virtual-time-budget=20000 --dump-dom "http://127.0.0.1:8080$BASE/" > dom.html 2> chrome.log || true
          if grep -q '<div id="root"></div>' dom.html || ! grep -q '<div id="root">' dom.html; then
            echo "::error::the app did not render"; grep -i 'uncaught\|error' chrome.log | head -20; exit 1
          fi
          grep -q 'http-equiv="Content-Security-Policy"' "$dist/index.html" || { echo "::error::the CSP meta tag is missing"; exit 1; }
          grep -iE 'uncaught|refused to|content security policy' chrome.log | head -20 | sed 's/^/::warning::/' || true
          echo "[*] the app rendered ($(wc -c < dom.html) bytes of DOM)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
