name: pages

# Builds the feiyi web app (web/app, a fork of getpaseo/paseo packages/app) on GitHub Pages,
# so a browser can pair with feiyi through the relay without depending on app.paseo.sh.
# The build itself is web-app.yml, shared with the macOS binary in build.yml.
# Point the daemon's pairing link at it with
# PASEO_APP_BASE_URL=https://<user>.github.io/<repo> (or your custom domain).
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "getpaseo/paseo tag or commit to build (empty: the version pinned in web-app.yml)"
        required: false
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml, .github/workflows/web-app.yml, "web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5

  build:
    needs: base
    uses: ./.github/workflows/web-app.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref }}
      base_path: ${{ needs.base.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
